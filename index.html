<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trap House Society — Kigali Streetwear</title>
  <meta name="description" content="Trap House Society — streetwear shop in Remera Kisimenti, Kigali. Shirts, tees, hoodies, jeans, boxers and bags. Order on WhatsApp.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Trap House Society — Kigali Streetwear">
  <meta property="og:description" content="Browse the catalogue and order on WhatsApp. Remera Kisimenti, behind Ecobank, KG 18.">
  <meta property="og:image" content="assets/og.jpg">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to products</a>

  <header class="header">
    <button class="icon-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <a class="logo" href="#/" aria-label="Trap House Society — home">
      <img src="assets/logo.png" alt="Trap House Society" width="56" height="56">
    </a>
    <button class="icon-btn cart-btn" id="cart-btn" aria-label="Open cart" aria-controls="cart">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2L5 8Z M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span class="badge" id="cart-count" hidden>0</span>
    </button>
  </header>

  <!-- Menu: categories + search -->
  <div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Menu" inert>
    <div class="menu-top">
      <span class="menu-title">Menu</span>
      <button class="icon-btn" data-close aria-label="Close menu">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
    <form class="search" id="menu-search" role="search">
      <label for="menu-q" class="sr-only">Search products</label>
      <input id="menu-q" name="q" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search">
      <button type="submit" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l5 5" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </form>
    <nav class="menu-links" id="menu-links" aria-label="Categories"></nav>
    <div class="menu-foot" id="menu-foot"></div>
  </div>

  <main id="main" tabindex="-1">
    <p class="loading">Loading…</p>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- Cart drawer -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="cart" id="cart" role="dialog" aria-modal="true" aria-label="Cart" inert>
    <div class="cart-top">
      <h2 class="cart-title">Cart <span id="cart-title-count"></span></h2>
      <button class="icon-btn" data-close aria-label="Close cart">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
    <div class="cart-body" id="cart-body" aria-live="polite"></div>
    <div class="cart-foot" id="cart-foot"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
